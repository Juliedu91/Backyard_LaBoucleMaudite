<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>La Boucle Maudite — Chrono v12</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Creepster&family=Lilita+One&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0716;--card:rgba(30,16,48,.88);--fg:#f3e9ff;--mut:#a995c9;--acc:#ff7a1a;--ok:#9be564;--warn:#ffb020;--bad:#ff3b3b;--bd:#4a2a7a;
--fx:"Creepster","Chiller","Impact",fantasy;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:radial-gradient(ellipse at 50% -10%,#45197a 0%,#1a0b2e 45%,#0d0716 80%);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;justify-content:center;align-items:center;padding:16px 16px 70px;overflow-x:hidden;overflow-y:auto;transition:background .4s}
body.boo{background:radial-gradient(ellipse at 50% 40%,#7a1d1d 0%,#2a0a3a 60%,#0d0716 100%)}
.moon{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));right:18px;width:64px;height:64px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fffbe0,#ffe9a0 60%,#e8c870);box-shadow:0 0 40px 10px rgba(255,233,160,.35);pointer-events:none;z-index:0}
.bat{position:fixed;font-size:26px;pointer-events:none;z-index:0;left:-50px;animation:fly 14s linear infinite}
.bat:nth-of-type(2){top:18%;animation-duration:11s;animation-delay:-4s;font-size:20px}
.bat:nth-of-type(3){top:55%;animation-duration:17s;animation-delay:-9s;font-size:32px}
.bat:nth-of-type(4){top:8%;animation-duration:13s;animation-delay:-1s}
@keyframes fly{0%{transform:translate(0,0) scaleX(1)}25%{transform:translate(30vw,-30px) scaleX(-1)}50%{transform:translate(60vw,20px) scaleX(1)}75%{transform:translate(90vw,-20px) scaleX(-1)}100%{transform:translate(115vw,10px) scaleX(1)}}
.ground{position:fixed;left:0;right:0;bottom:0;padding-bottom:env(safe-area-inset-bottom,0px);height:calc(64px + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-around;align-items:flex-end;font-size:34px;background:linear-gradient(to top,#000 0%,transparent 100%);pointer-events:none;z-index:0}
@keyframes bob{50%{transform:translateY(-6px)}}
.app{position:relative;z-index:1;width:100%;max-width:440px;text-align:center}
.logo{width:150px;height:auto;display:block;margin:0 auto 2px;transform-origin:50% 100%;animation:run 1.1s ease-in-out infinite;filter:drop-shadow(2px 0 0 #fff4e0) drop-shadow(-2px 0 0 #fff4e0) drop-shadow(0 2px 0 #fff4e0) drop-shadow(0 -2px 0 #fff4e0) drop-shadow(0 0 16px rgba(255,122,26,.55))}
h1{font-family:"Lilita One","Arial Black",Impact,sans-serif;font-weight:400;font-size:34px;letter-spacing:.02em;text-transform:uppercase;color:#E8671C;margin:0 0 12px;line-height:1.05;text-shadow:0 0 14px rgba(255,122,26,.35)}
.card{background:var(--card);border:2px solid var(--acc);border-radius:22px;padding:22px 16px;box-shadow:0 0 28px rgba(255,122,26,.35),inset 0 0 30px rgba(120,50,200,.25);backdrop-filter:blur(4px)}
.boo .card{animation:shake .5s 5;border-color:var(--ok);box-shadow:0 0 40px rgba(155,229,100,.6)}
@keyframes shake{25%{transform:translate(-5px,2px) rotate(-1deg)}75%{transform:translate(5px,-2px) rotate(1deg)}}
.lap{font-family:var(--fx);font-size:30px;letter-spacing:.08em;color:var(--ok);text-shadow:0 0 12px rgba(155,229,100,.6)}
.time{font-size:clamp(64px,22vw,104px);font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1;margin:8px 0;color:#fff;text-shadow:0 0 22px rgba(255,122,26,.8);transition:color .3s}
.time.warn{color:var(--warn)}
.time.bad{color:var(--bad);text-shadow:0 0 26px rgba(255,59,59,.9);animation:flick .7s infinite}
@keyframes flick{0%,100%{opacity:1}45%{opacity:.55}50%{opacity:1}55%{opacity:.7}}
.bar{height:12px;border-radius:6px;background:#2a1647;overflow:hidden;margin:12px 6px;border:1px solid var(--bd)}
.bar>i{display:block;height:100%;width:0;background:var(--ok);box-shadow:0 0 12px currentColor;transition:background .3s}
.label{font-size:13px;color:var(--mut)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px}
.stat b{display:block;font-size:22px;font-variant-numeric:tabular-nums;margin-top:2px;color:var(--acc)}
.btns{display:flex;gap:10px;margin-top:14px}
button{flex:1;font-family:var(--fx);letter-spacing:.06em;font-size:24px;padding:12px;border-radius:14px;border:1px solid var(--bd);background:var(--card);color:var(--fg);cursor:pointer}
button.main{background:linear-gradient(#ff8c2e,#d9480f);color:#fff;border-color:var(--acc);box-shadow:0 0 18px rgba(255,122,26,.55);text-shadow:0 2px 0 #7a2400}
button:disabled{opacity:.85}
button:active{transform:scale(.97)}
details{margin-top:14px;font-size:14px;color:var(--mut)}
summary{cursor:pointer}
.set{display:flex;gap:10px;justify-content:center;margin-top:10px;flex-wrap:wrap}
.set label{display:flex;flex-direction:column;gap:4px;font-size:12px}
.set input{width:110px;padding:8px;border-radius:8px;border:1px solid var(--bd);background:#1a0b2e;color:var(--fg);font:inherit;text-align:center}
.zone .card{animation:zonepulse 1.2s ease-in-out infinite}
@keyframes zonepulse{50%{border-color:var(--bad);box-shadow:0 0 38px rgba(255,59,59,.65),inset 0 0 30px rgba(255,59,59,.25)}}
.zone #sub{color:var(--warn);font-weight:700}
html.fs body{overflow:hidden}
.fsbtn{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:12px;z-index:3;flex:none;font-size:16px;padding:8px 12px;border-radius:12px}
.logobox{position:relative;display:inline-block;margin:0 auto 8px}
.lshadow{position:absolute;left:50%;bottom:-6px;width:90px;height:12px;margin-left:-45px;border-radius:50%;background:rgba(0,0,0,.6);filter:blur(3px);animation:lsh 1.1s ease-in-out infinite}
@keyframes run{0%,100%{transform:translateY(0) rotate(-3deg) scale(1.04,.96)}50%{transform:translateY(-12px) rotate(3deg) scale(.97,1.03)}}
@keyframes lsh{0%,100%{transform:scale(1);opacity:.6}50%{transform:scale(.7);opacity:.3}}
.zone .logo,.zone .lshadow{animation-duration:.5s}
.boo .logo{animation:jump .5s ease-out 3}
@keyframes jump{40%{transform:translateY(-34px) rotate(-8deg) scale(1.12)}}
.paused .time{animation:flick 1.4s infinite}
.barwrap{position:relative;margin:12px 6px}
.barwrap .bar{margin:0}
#seek{position:absolute;left:-8px;top:50%;width:calc(100% + 16px);height:28px;margin:0;transform:translateY(-50%);background:transparent;-webkit-appearance:none;appearance:none;cursor:pointer;z-index:2;outline:none}
#seek::-webkit-slider-runnable-track{background:transparent;height:28px;border:0}
#seek::-moz-range-track{background:transparent;height:28px;border:0}
#seek::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;margin-top:6px;border-radius:50%;background:var(--acc);border:2px solid #fff4e0;box-shadow:0 0 6px rgba(255,122,26,.7);opacity:.55;transition:opacity .2s,transform .2s}
#seek::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:var(--acc);border:2px solid #fff4e0;box-shadow:0 0 6px rgba(255,122,26,.7);opacity:.55;transition:opacity .2s,transform .2s}
#seek:hover::-webkit-slider-thumb,#seek:active::-webkit-slider-thumb,#seek:focus-visible::-webkit-slider-thumb{opacity:1;transform:scale(1.25)}
#seek:hover::-moz-range-thumb,#seek:active::-moz-range-thumb,#seek:focus-visible::-moz-range-thumb{opacity:1;transform:scale(1.25)}
#seek:disabled{cursor:default}
#seek:disabled::-webkit-slider-thumb{opacity:0}
#seek:disabled::-moz-range-thumb{opacity:0}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;box-shadow:inset 0 0 0 rgba(255,59,59,0);transition:box-shadow .6s}
body.zone::after{box-shadow:inset 0 0 100px rgba(255,122,26,.4)}
body.hot::after{box-shadow:inset 0 0 140px rgba(255,59,59,.55);animation:vig .7s ease-in-out infinite}
body.crit::after{box-shadow:inset 0 0 190px rgba(255,59,59,.8);animation-duration:.5s}
@keyframes vig{50%{opacity:.4}}
body.zone .card{border-color:var(--acc);animation:glow1 1.2s ease-in-out infinite}
@keyframes glow1{0%,100%{box-shadow:0 0 18px 2px rgba(255,122,26,.55),0 0 50px 8px rgba(255,122,26,.3),inset 0 0 24px rgba(255,122,26,.18)}50%{box-shadow:0 0 36px 8px rgba(255,150,40,.95),0 0 90px 24px rgba(255,122,26,.55),0 0 150px 40px rgba(255,90,0,.28),inset 0 0 46px rgba(255,122,26,.38)}}
body.hot .card{border-color:var(--bad);animation:glow2 .7s ease-in-out infinite}
@keyframes glow2{0%,100%{box-shadow:0 0 24px 4px rgba(255,59,59,.6),0 0 70px 14px rgba(255,59,59,.35),inset 0 0 30px rgba(255,59,59,.25)}50%{box-shadow:0 0 50px 14px rgba(255,70,50,1),0 0 110px 34px rgba(255,59,59,.65),0 0 180px 60px rgba(255,40,40,.32),inset 0 0 60px rgba(255,59,59,.5)}}
body.crit .card{animation:glow2 .45s ease-in-out infinite}
body.zone .bar{box-shadow:0 0 18px rgba(255,122,26,.75)}
body.hot .bar{box-shadow:0 0 22px rgba(255,59,59,.9)}
body.zone .time.warn{text-shadow:0 0 34px rgba(255,150,40,1),0 0 70px rgba(255,122,26,.6)}
body.crit .time{text-shadow:0 0 40px rgba(255,59,59,1),0 0 90px rgba(255,59,59,.75)}
html.fs .app{max-width:700px}
html.fs .card{container-type:inline-size}
html.fs .time{font-size:200px;font-size:33cqw;line-height:1;margin:4px 0;white-space:nowrap}
html.fs .lap{font-size:38px}
html.fs .logo{width:96px}
html.fs h1{font-size:30px;margin-bottom:8px}
html.fs details{display:none}
.spectator .btns,.spectator details,.spectator #seek,.spectator #spec{display:none}
#snd{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:14px;z-index:3;font-size:22px;opacity:.55;cursor:pointer}
#bcast{margin:0 0 12px;padding:12px 14px;border:2px solid var(--acc);border-radius:16px;background:rgba(255,122,26,.16);color:#fff;font-weight:700;font-size:18px;line-height:1.3;box-shadow:0 0 22px rgba(255,122,26,.5);animation:bcast 1.6s ease-in-out infinite;word-break:break-word}
#bcast::before{content:"📣 "}
@keyframes bcast{50%{box-shadow:0 0 38px rgba(255,150,40,.95)}}
html.fs #bcast{font-size:26px}
#laps{margin-top:14px}
#laplist{max-height:38vh;overflow:auto;text-align:left;font-size:14px;margin-top:8px;border:1px solid var(--bd);border-radius:12px;padding:6px 10px;background:var(--card)}
.lhead{color:var(--mut);font-size:12px;margin:8px 0 2px}
.lrow{display:flex;flex-wrap:wrap;justify-content:space-between;gap:2px 10px;padding:4px 0;border-bottom:1px solid var(--bd);font-variant-numeric:tabular-nums}
.lrow b{color:var(--acc)}
.lrow i{color:var(--mut);font-style:normal;font-size:12px}
html.fs #laps{display:none}
body:not(.spectator) #laps{display:none}
#scream{position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle,#8a0000 0%,#000 75%);animation:scrbg 1.5s forwards;cursor:pointer;overflow:hidden}
#scream svg{width:min(115vw,115vh);height:auto;filter:drop-shadow(0 0 40px rgba(255,60,0,.9));animation:scrface 1.5s forwards}
@keyframes scrbg{0%{opacity:0}3%{opacity:1}85%{opacity:1}100%{opacity:0}}
@keyframes scrface{0%{transform:scale(.08)}5%{transform:scale(1.3) rotate(-3deg)}10%{transform:scale(1.15) translate(-12px,8px) rotate(3deg)}15%{transform:scale(1.3) translate(10px,-8px) rotate(-2deg)}20%{transform:scale(1.18) translate(-8px,6px) rotate(2deg)}25%{transform:scale(1.32) translate(8px,-6px)}30%{transform:scale(1.2) translate(-6px,4px) rotate(-2deg)}40%{transform:scale(1.3) translate(6px,-4px)}55%{transform:scale(1.22) translate(-4px,3px)}100%{transform:scale(1.45)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>

  <h1>La Boucle Maudite</h1>
  <div class="label" id="spec" hidden style="margin-bottom:10px;font-weight:700"></div>
  <div id="bcast" hidden></div>
  <div class="card">
    <div class="lap" id="lap">Prêt à hurler</div>
    <div class="time" id="time">60:00</div>
    <div class="label" id="sub">Avant d’être éliminé…</div>
    <div class="barwrap"><div class="bar"><i id="fill"></i></div><input type="range" id="seek" min="0" max="3600" step="1" value="0" disabled aria-label="Position dans le tour" title="Ajuster la position dans le tour"><span hidden id="seekv">00:00</span><span hidden id="seekmax">60:00</span></div>
  </div>
  <div class="stats">
    <div class="stat"><span class="label">Temps total</span><b id="total">00:00:00</b></div>
    <div class="stat"><span class="label">Distance</span><b id="dist">0,0 km</b></div>
  </div>
  <div id="laps">
    <button id="lapmark" class="main" disabled style="width:100%;font-size:26px;padding:14px">✅ Tour terminé</button>
    <div class="label" id="lapinfo" style="margin-top:6px;min-height:16px"></div>
    <button id="lapshow" style="width:100%;font-size:18px;padding:10px;margin-top:6px">📋 Mes tours (0)</button>
    <div id="lapbox" hidden>
      <div id="laplist"></div>
      <div class="set" style="margin-top:8px"><button id="lapundo" style="font-size:16px;padding:8px">Annuler le dernier</button><button id="lapcopy" style="font-size:16px;padding:8px">Copier</button><button id="lapclear" style="font-size:16px;padding:8px">Tout effacer</button></div>
    </div>
  </div>
  <div class="btns">
    <button class="main" id="start">Démarrer</button>
    <button id="pause" style="flex:.8" disabled>Pause</button>
    <button id="reset" style="flex:.5">Reset</button>
  </div>
  <details>
    <summary>Réglages</summary>
    <div class="set">
      <label>Durée du tour (min)<input id="dur" type="number" min="0.1" step="any" value="60"></label>
      <label>Distance (km)<input id="km" type="number" min="0" step="any" value="5.2"></label>
      <label>Alerte finale (%)<input id="pct" type="number" min="1" max="50" step="any" value="8.33"></label>
      <label>Annonce vocale<input id="voice" type="checkbox" checked style="width:28px;height:28px"></label>
      <label>Musique stressante<input id="music" type="checkbox" checked style="width:28px;height:28px"></label>
      <label>Vibration<input id="vibe" type="checkbox" checked style="width:28px;height:28px"></label>
      <label>Screamer spectateurs<input id="scream" type="checkbox" checked style="width:28px;height:28px"></label>
    </div>
    <p>Astuce : mets 1 minute pour tester le chrono.</p><div class="set"><button onclick="laugh(9,165,.7)" style="font-size:16px;padding:10px">🎃 Tester le rire</button><button onclick="say('Préparez-vous pour le prochain tour')" style="font-size:16px;padding:10px">🎙️ Tester la voix</button><button onclick="musicTest()" style="font-size:16px;padding:10px">🎵 Tester la musique</button><button onclick="var ok=buzz([500,150,500]);$('shmsg').textContent=ok?'Vibration envoyée ✔':'Vibration non disponible sur cet appareil'" style="font-size:16px;padding:10px">📳 Tester la vibration</button><button onclick="jumpscare()" style="font-size:16px;padding:10px">👻 Tester le screamer</button></div>
  <div class="set" id="sharebox"><button id="copyview" style="font-size:16px;padding:10px">🔗 Lien spectateur</button><button id="copyctl" style="font-size:16px;padding:10px">🔑 Lien contrôle</button></div><p class="label" id="shmsg" style="word-break:break-all"></p>
  </details>
  <details id="msgbox" open>
    <summary>📣 Message aux spectateurs</summary>
    <div class="set" style="flex-direction:column;align-items:stretch">
      <input id="msgtxt" type="text" maxlength="200" placeholder="Ex : ravito dans 5 min, bravo à tous…" style="width:100%;text-align:left">
      <div class="set" style="margin-top:0">
        <label>Affichage<select id="msgdur" style="width:140px;padding:8px;border-radius:8px;border:1px solid var(--bd);background:#1a0b2e;color:var(--fg);font:inherit"><option value="30">30 s</option><option value="120" selected>2 min</option><option value="0">Jusqu'à effacement</option></select></label>
        <label>Lire à voix haute<input id="msgvoice" type="checkbox" style="width:28px;height:28px"></label>
      </div>
      <div class="set" style="margin-top:0"><button id="msgsend" style="font-size:18px;padding:10px">Envoyer</button><button id="msgclear" style="font-size:18px;padding:10px">Effacer</button></div>
    </div>
  </details>
</div>
<script>
const $=id=>document.getElementById(id);
let startAt=null,timer=null,lastLap=0,lastSec=null,ac=null,wl=null,zoneFired=false,pausedAt=null,seeking=false;
function ensureAudioContext(){
  if(ac)return ac;
  const AudioContextClass=window.AudioContext||window.webkitAudioContext;
  if(!AudioContextClass)return null;
  try{ac=new AudioContextClass()}catch(e){}
  return ac;
}
const nowT=()=>pausedAt||Date.now();
const pad=n=>String(n).padStart(2,'0');
const fmt=s=>{s=Math.max(0,Math.floor(s));return pad(Math.floor(s/60))+':'+pad(s%60)};
function beep(f=880,d=.15,v=.4){
  try{ensureAudioContext();
  const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;o.connect(g);g.connect(ac.destination);
  g.gain.setValueAtTime(v,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);
  o.start();o.stop(ac.currentTime+d)}catch(e){}
}
function tick(){
  const lapMs=Math.max(0.1,parseFloat($('dur').value)||60)*60000;
  const km=parseFloat($('km').value)||0;
  const el=nowT()-startAt;
  const lap=Math.floor(el/lapMs)+1;
  const remMs=lapMs-(el%lapMs);
  const rem=Math.ceil(remMs/1000);
  $('lap').textContent='Tour '+lap;
  $('time').textContent=fmt(rem);
  $('fill').style.width=(100*(el%lapMs)/lapMs)+'%';
  if(!seeking){$('seek').max=Math.round(lapMs/1000);$('seek').value=Math.floor((el%lapMs)/1000);}
  $('seekv').textContent=fmt((el%lapMs)/1000);$('seekmax').textContent=fmt(lapMs/1000);
  const zoneSec=Math.round(lapMs/1000*((parseFloat($('pct').value)||8.33)/100));
  const inZone=rem<=zoneSec;
  document.body.classList.toggle('zone',inZone);
  if(inZone&&!pausedAt&&startAt)musicUpdate(Math.min(1,Math.max(0,1-rem/zoneSec)));else if(!musTest)musicStop();
  const cls=inZone&&rem<=Math.min(60,zoneSec/2)?'bad':inZone?'warn':'';
  document.body.classList.toggle('hot',cls==='bad');document.body.classList.toggle('crit',inZone&&rem<=10);
  $('time').className='time '+cls;
  $('fill').style.background=cls==='bad'?'var(--bad)':cls==='warn'?'var(--warn)':'var(--ok)';
  const t=Math.floor(el/1000);
  $('total').textContent=pad(Math.floor(t/3600))+':'+pad(Math.floor(t%3600/60))+':'+pad(t%60);
  $('dist').textContent=((lap-1)*km).toFixed(1).replace('.',',')+' km';
  $('sub').textContent=pausedAt?'⏸ EN PAUSE':inZone?'⚠️ Rejoins la ligne de départ !':'Avant d’être éliminé…';
  if(lap!==lastLap){ if(lastLap){if(!laughScheduled)laugh(9,165,.7);document.body.classList.add('boo');setTimeout(()=>document.body.classList.remove('boo'),2500);} lastLap=lap; lastSec=null; zoneFired=false; laughScheduled=false; }
  if(rem===1&&!laughScheduled&&!seeking&&!pausedAt){laughScheduled=true;laugh(9,165,.7,remMs/1000);vib(remMs);duck(1.4);}
  if(rem!==lastSec){
    lastSec=rem;
    if(seeking||pausedAt){}
    else if(rem<=10&&rem>=1)say(NUM[rem],1.25);
    else if(inZone&&!zoneFired){zoneFired=true;say('Préparez-vous pour le prochain tour');}
    else if(inZone&&rem===60)say('Une minute');
    else if(inZone&&rem===30)say('Trente secondes');
    else if(inZone&&rem%60===0)say('Plus que '+(rem/60)+' minutes');

    out+='<div class="lhead">Course du '+d.toLocaleDateString('fr-FR')+' à '+d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})+' — '+L.length+' tour'+(L.length>1?'s':'')+' · moy. '+mmss(avg)+' · '+kmTxt(L[L.length-1].km)+'</div>';
    L.forEach(x=>{out+='<div class="lrow"><span>Tour <b>'+x.lap+'</b></span><span><b>'+mmss(x.tLap)+'</b></span><span>cumul '+hms(x.tTot)+'</span><span>'+kmTxt(x.km)+'</span><i>'+clk(x.at)+'</i></div>'});
  });
  $('laplist').innerHTML=out;
}
function markLap(){
  const c=curLapInfo();if(!c)return;
  const km=parseFloat($('km').value)||0;
  const e={race:startAt,lap:c.lap,tLap:Math.round(c.inLap),tTot:Math.round(c.total),at:Date.now(),km:Math.round(c.lap*km*100)/100};
  const i=myLaps.findIndex(x=>x.race===e.race&&x.lap===e.lap);
  if(i>=0)myLaps[i]=e;else myLaps.push(e);
  saveLaps();renderLaps();
  try{if($('vibe').checked)buzz([60])}catch(_){}
  $('lapinfo').textContent='Tour '+c.lap+' marqué à '+mmss(c.inLap)+(i>=0?' (mis à jour)':' ✔');
  if($('scream').checked)jumpscare();
}
$('lapmark').onclick=markLap;
$('lapshow').onclick=()=>{const b=$('lapbox');b.hidden=!b.hidden;if(!b.hidden)renderLaps()};
$('lapundo').onclick=()=>{
  if(!myLaps.length)return;
  let k=0;myLaps.forEach((x,i)=>{if(x.at>myLaps[k].at)k=i});
  const x=myLaps.splice(k,1)[0];saveLaps();renderLaps();
  $('lapinfo').textContent='Tour '+x.lap+' supprimé';
};
$('lapcopy').onclick=()=>{
  const rows=['course;tour;temps_au_tour;temps_total;distance_km;heure'];
  [...myLaps].sort((a,b)=>a.race-b.race||a.lap-b.lap).forEach(x=>rows.push([new Date(x.race).toLocaleString('fr-FR'),x.lap,mmss(x.tLap),hms(x.tTot),String(x.km).replace('.',','),clk(x.at)].join(';')));
  const txt=rows.join('\n');
  const done=()=>{$('lapinfo').textContent='Historique copié ✔'};
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(done,()=>{$('laplist').textContent=txt});
  else $('laplist').textContent=txt;
};
$('lapclear').onclick=()=>{
  if(lapClrT){clearTimeout(lapClrT);lapClrT=null;myLaps=[];saveLaps();renderLaps();$('lapclear').textContent='Tout effacer';return}
  $('lapclear').textContent='Confirmer ?';
  lapClrT=setTimeout(()=>{lapClrT=null;$('lapclear').textContent='Tout effacer'},3000);
};
setInterval(()=>{
  const c=curLapInfo(),b=$('lapmark');
  b.disabled=!c;
  b.textContent=c?'✅ Tour '+c.lap+' terminé':'✅ Tour terminé';
},500);
renderLaps();

// ---- Screamer (validation d'un tour) ----
const SCR_SVG='<svg viewBox="0 0 200 180" aria-hidden="true"><ellipse cx="100" cy="100" rx="90" ry="72" fill="#E8671C" stroke="#1A1210" stroke-width="5"/><path d="M100 30C62 48 62 150 100 170C138 150 138 48 100 30Z" fill="#F08A3C" stroke="#1A1210" stroke-width="4"/><rect x="92" y="14" width="16" height="22" rx="3" fill="#4A5A28" stroke="#1A1210" stroke-width="4"/><polygon points="34,62 90,84 46,104" fill="#FFE45C" stroke="#1A1210" stroke-width="4" stroke-linejoin="round"/><polygon points="166,62 110,84 154,104" fill="#FFE45C" stroke="#1A1210" stroke-width="4" stroke-linejoin="round"/><circle cx="62" cy="88" r="7" fill="#1A1210"/><circle cx="138" cy="88" r="7" fill="#1A1210"/><path d="M24 122L50 112L64 138L82 114L100 142L118 114L136 138L150 112L176 122Q170 176 100 176Q30 176 24 122Z" fill="#FFE45C" stroke="#1A1210" stroke-width="5" stroke-linejoin="round"/><path d="M56 132L66 150L78 130M122 130L134 150L144 132" fill="#1A1210" stroke="#1A1210" stroke-width="4" stroke-linejoin="round"/></svg>';
function screamSound(){
  try{
    ensureAudioContext();
    if(ac.state==='suspended')ac.resume();
    const t=ac.currentTime,dur=1.3;
    const out=ac.createGain();out.gain.value=1.6;
    const comp=ac.createDynamicsCompressor();comp.threshold.value=-16;comp.knee.value=8;comp.ratio.value=14;comp.attack.value=.002;comp.release.value=.2;
    out.connect(comp);comp.connect(ac.destination);
    const ws=ac.createWaveShaper(),cv=new Float32Array(512);
    for(let i=0;i<512;i++){cv[i]=Math.tanh((i/256-1)*6)}
    ws.curve=cv;ws.oversample='4x';
    const env=ac.createGain();
    env.gain.setValueAtTime(0,t);env.gain.linearRampToValueAtTime(1,t+.015);env.gain.setValueAtTime(1,t+dur-.35);env.gain.linearRampToValueAtTime(0,t+dur);
    ws.connect(env);
    const f1=ac.createBiquadFilter(),f2=ac.createBiquadFilter();
    f1.type=f2.type='bandpass';f1.Q.value=4;f2.Q.value=5;
    f1.frequency.setValueAtTime(800,t);f1.frequency.linearRampToValueAtTime(1500,t+.3);f1.frequency.linearRampToValueAtTime(900,t+dur);
    f2.frequency.setValueAtTime(1900,t);f2.frequency.linearRampToValueAtTime(3000,t+.3);f2.frequency.linearRampToValueAtTime(2000,t+dur);
    const g1=ac.createGain(),g2=ac.createGain();g1.gain.value=1.2;g2.gain.value=.7;
    f1.connect(g1);f2.connect(g2);g1.connect(env);g2.connect(env);
    env.connect(out);
    const lfo=ac.createOscillator(),ld=ac.createGain();lfo.frequency.value=34;ld.gain.value=70;lfo.connect(ld);
    [0,-17,23,40].forEach(dt=>{
      const o=ac.createOscillator();o.type='sawtooth';
      o.frequency.setValueAtTime(420,t);o.frequency.exponentialRampToValueAtTime(1500,t+.25);o.frequency.setValueAtTime(1500,t+.25);o.frequency.exponentialRampToValueAtTime(760,t+dur);
      o.detune.value=dt;ld.connect(o.frequency);
      const og=ac.createGain();og.gain.value=.22;o.connect(og);og.connect(ws);og.connect(f1);og.connect(f2);
      o.start(t);o.stop(t+dur+.05);
    });
    lfo.start(t);lfo.stop(t+dur+.05);
    const n=ac.createBuffer(1,Math.floor(ac.sampleRate*dur),ac.sampleRate),d=n.getChannelData(0);
    for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    const ns=ac.createBufferSource();ns.buffer=n;
    const hp=ac.createBiquadFilter();hp.type='highpass';hp.frequency.value=2500;
    const ng=ac.createGain();ng.gain.setValueAtTime(.7,t);ng.gain.exponentialRampToValueAtTime(.05,t+dur);
    ns.connect(hp);hp.connect(ng);ng.connect(env);ns.start(t);
  }catch(e){}
}
function jumpscare(){
  try{
    const old=document.getElementById('scream');if(old)old.remove();
    const el=document.createElement('div');el.id='scream';el.innerHTML=SCR_SVG;
    el.onclick=()=>el.remove();
    document.body.appendChild(el);
    setTimeout(()=>el.remove(),1550);
    screamSound();
    try{if($('vibe').checked)buzz([250,60,350])}catch(_){}
  }catch(e){}
}
document.addEventListener('visibilitychange',()=>{if(startAt&&!document.hidden)lock()});
</script>
